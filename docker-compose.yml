# GB10(DGX OS, arm64)에서:  docker compose up -d --build   →  http://<GB10 IP>:8080  (아이디 operator, 비밀번호는 .env 의 WEB_PASSWORD 또는 처음 시작 로그: docker compose logs web)
# 로봇 고르기: .env 에 ROBOT=<robots/ 아래 폴더 이름>  (기본 demo_arm = 모의 팔)
services:
  ros:
    build: ./ros
    # DDS(ROS2 통신)가 같은 네트워크의 실제 로봇/다른 PC와 통하려면 host 네트워크가 필요.
    # rosbridge(:9090)는 이 PC 안(127.0.0.1)에서만 받는다 → 브라우저는 웹(:8080)의 /ros 로 (비밀번호 확인 뒤)
    network_mode: host
    ipc: host
    volumes:
      - ./ros:/ros
      - ./robots:/robots
      - ./data:/data        # 녹화된 에피소드: data/episodes/
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}   # AI 비전 판단·시나리오 생성. .env 에 넣는다 (repo에 넣지 않음)
    command: ros2 launch /ros/bringup.launch.py robot:=${ROBOT:-demo_arm}
    # ros2 launch는 SIGINT로 멈춰야 하위 노드에 종료를 전달한다 → 녹화 중이던 bag도 정상 마무리됨
    stop_signal: SIGINT
    stop_grace_period: 30s
    restart: unless-stopped

  # 도구: 'docker compose up'에는 안 뜨고 필요할 때만 실행
  #   docker compose run --rm ai python convert_lerobot.py /data/episodes --out /data/lerobot/<이름>
  ai:
    build: ./ai
    profiles: [tools]
    volumes:
      - ./ai:/ai
      - ./robots:/robots
      - ./data:/data

  web:
    build: ./web
    # rosbridge(127.0.0.1:9090)에 중계하려고 호스트 네트워크. nginx가 :8080 에서 받음
    network_mode: host
    volumes:
      - ./robots:/usr/share/nginx/html/robots:ro  # URDF 메시·작업 셀 파일 (웹 3D 뷰가 /robots/<로봇>/… 로 받음)
      - ./data/web:/data                          # 자동 생성한 웹 비밀번호 보관
    environment:
      - WEB_USER=${WEB_USER:-operator}
      - WEB_PASSWORD=${WEB_PASSWORD:-}           # .env 에 넣는다 (repo에 넣지 않음). 비우면 처음 시작할 때 만들어 로그에 한 번 보여 줌
      - WEB_ALLOW=${WEB_ALLOW:-}                 # 예: 192.168.10.0/24 (비우면 비밀번호만 확인)
    restart: unless-stopped
