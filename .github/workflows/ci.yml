# 업데이트가 기존 기능을 깨지 않는지 매 push/PR마다 확인: 웹 빌드 + ROS 스택(Docker) 스모크 테스트
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build && node src/history.test.js && node src/clipboard.test.js && node src/cameraFrames.test.js && node src/check.test.js && node src/scene3d.test.js && node src/motionPlan.test.js
        working-directory: web

  ros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build ros
      - name: smoke test (실행·정지·오류·녹화·분기·병렬·반복·시뮬레이션·저장소·AI·홈·비상정지·카메라·다시 보기)
        run: docker compose exec -T ros bash -c "source /opt/ros/jazzy/setup.bash && cd /ros && python3 test_ai.py && python3 smoke_test.py"
      - name: LeRobot 변환 (합성 녹화 테스트 + 방금 녹화된 실제 에피소드)
        run: |
          docker compose run --rm ai python test_check.py
          docker compose run --rm ai python test_convert.py
          docker compose run --rm ai python convert_lerobot.py /data/episodes --out /data/lerobot/ci
          docker compose run --rm ai python check_dataset.py /data/lerobot/ci
      - if: always()
        run: docker compose logs --tail 150 ros
