# 로봇 프로파일. 로봇(또는 작업 셀)이 바뀌면 robots/<이름>/ 폴더를 새로 만들고 ROBOT=<이름> 으로 고른다.
# 코드(ros/, web/)는 수정하지 않는다.

# 팔 관절 이름 (순서 = 웹 MoveJ의 J1..Jn). 드라이버의 /joint_states 이름과 같아야 함
joints: [joint1, joint2, joint3, joint4, joint5, joint6]

# 팔 드라이버의 FollowJointTrajectory 액션 (ros2_control joint_trajectory_controller 표준)
trajectory_action: /arm_controller/follow_joint_trajectory

# 홈 자세 (°, joints 순서). 웹의 '홈으로' 버튼과 '홈 위치로 이동' 블록이 쓴다. 생략하면 전부 0
home: [0, 0, 0, 0, 0, 0]

# 웹 '비상정지'를 드라이버/안전 PLC 쪽에도 알릴 토픽 (std_msgs/Bool, true = 정지, latched).
# 받는 쪽이 보호 정지(protective stop)를 걸게 연결한다. 하드웨어 비상정지 회로를 대신하지 않는다
# estop_topic: /safety/software_estop

# true면 드라이버 대신 모의 팔(ros/mock_arm.py)을 띄운다
mock: true

# 있으면 robot_state_publisher가 /robot_description 으로 발행하고 웹 3D 뷰어가 그것을 그린다.
# 제조사 드라이버가 직접 /robot_description 을 발행하면 이 줄을 지운다.
urdf: robot.urdf

# 그리퍼 노드가 보내는 토픽 (std_msgs/Bool, true=닫기). 장비에 맞게 바꾼다
gripper_topic: /gripper/cmd

# AI 비전 판단 노드가 보는 카메라 (sensor_msgs/Image 또는 CompressedImage)
camera_topic: /camera/color/image_raw/compressed

# true면 카메라 대신 모의 카메라(ros/mock_camera.py)가 camera_topic으로 장면을 보낸다 (실제 카메라를 달면 지운다)
mock_camera: true

# 에피소드 녹화 대상 토픽 (카메라는 camera_topic과 같은 것, /workflow/vision = AI 비전 판단 기록)
record_topics:
  - /joint_states
  - /workflow/command
  - /workflow/status
  - /workflow/vision
  - /tf
  - /tf_static
  - /camera/color/image_raw/compressed

# LeRobot 데이터셋 변환 설정 (ai/convert_lerobot.py)
dataset:
  fps: 30
  # observation.state / action 에 들어갈 관절. 생략하면 위 joints (그리퍼를 넣으려면 여기에 추가)
  # joints: [joint1, joint2, joint3, joint4, joint5, joint6, gripper_joint]
  # action(프레임마다의 목표 관절값):
  #   next_state  = 다음 프레임의 관절값. 리더 팔 없이 조그/워크플로로 녹화할 때
  #   <토픽 이름> = 그 토픽의 직전 값. 리더-팔로워 텔레옵이면 /leader/joint_states (JointState 또는 JointTrajectory)
  action: next_state
  # LeRobot 카메라 이름: 토픽 (sensor_msgs/Image 또는 CompressedImage). 위 record_topics 에도 넣어야 녹화됨
  cameras:
    front: /camera/color/image_raw/compressed
  # 카메라를 더 달면 이름: 토픽 으로 추가 (record_topics 에도)
  #   wrist: /wrist_camera/image_raw
